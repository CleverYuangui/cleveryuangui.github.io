<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vote Statistics &amp; Random Selection</title>

    <!-- Google Fonts China -->
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link href="https://fonts.googleapis.cn/css2?family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- style -->
    <link rel="stylesheet" type="text/css" href="/css/fonts/Hans.css" />
    <link rel="stylesheet" type="text/css" href="/css/common.css" />
    <link rel="stylesheet" type="text/css" href="/css/tools/poll.css" />
</head>
<body>
    <!-- header -->
    <header class="site-header" role="banner">
        <div class="container">
            <!-- Logo -->
            <a class="brand" href="#" aria-label="首页">
                <img class="logo" src="/img/avatar-CN.svg" alt="聪明的小圆规" />
                <span class="brand-name">Clever<span class="accent">Yuangui</span></span>
            </a>

            <!-- Navigation -->
            <nav aria-label="主导航" class="nav-desktop-wrapper">
                <span class="spacer"></span>
                <ul class="nav-desktop" role="list">
                    <a href="#"><li class="active">Poll</li></a>
                </ul>
            </nav>
            <nav class="nav-mobile-toggle">
                <button class="bars-btn" id="barsBtn" aria-label="菜单" aria-expanded="false" aria-haspopup="true">
                    <span class="fas fa-bars"></span>
                </button>
                <ul class="nav-mobile" id="navMenu" role="menu">
                    <a href="#"><li class="active">Poll</li></a>
                </ul>
            </nav>

            <span class="spacer"></span>
            <!-- Theme -->
            <div class="theme-toggle">
                <div class="theme-desktop" role="group" aria-label="模式切换">
                    <button class="theme-option light" id="themeLight" data-theme="light" aria-label="浅色模式">
                        <span class="fas fa-sun"></span>
                    </button>
                    <button class="theme-option dark" id="themeDark" data-theme="dark" aria-label="深色模式">
                        <span class="fas fa-moon"></span>
                    </button>
                </div>
                <button class="theme-mobile" id="themeMobile" aria-label="切换模式">
                    <span class="theme-button light" data-theme="light"><span class="fas fa-sun"></span></span>
                    <span class="theme-button dark" data-theme="dark"><span class="fas fa-moon"></span></span>
                </button>
            </div>

            <!-- Language -->
            <div class="lang-wrapper">
                <button class="lang-toggle" id="langToggle" aria-label="切换语言" aria-expanded="false" aria-haspopup="true">
                    <span class="globe"><span class="fas fa-globe"></span></span>
                    <span class="lang-label">语言 / Language</span>
                    <span class="caret"><span class="fas fa-chevron-down"></span></span>
                </button>
                <div class="lang-dropdown" id="langDropdown" role="menu">
                    <a href="#"><button role="menuitem" data-lang="zh-CN" class="current">简体中文<span class="english-name">Chinese (Simplified)</span></button></a>
                </div>
            </div>
        </div>
    </header>

    <!-- main -->
    <main>
        <div class="container section">
            <noscript>
                <p class="js-warning">
                    您的浏览器禁用了 JavaScript，本工具可能无法使用。
                </p>
            </noscript>
            <h1 class="title">Vote Statistics &amp; Random Selection</h1>
            <div class="total-line">
                Total: <span class="total-value" id="total">0</span>
            </div>
            <div class="action-row">
                <div class="action-group" id="normalActions">
                    <button class="btn" id="selectBtn">Select</button>
                    <span class="spacer"></span>
                    <button class="btn" id="resetBtn">Reset</button>
                    <button class="btn" id="clearBtn">Clear</button>
                    <button class="btn" id="clearAllBtn">Clear All</button>
                </div>
                <div class="action-group" id="selectActions" hidden>
                    <button class="btn" id="selectAllBtn">Select All</button>
                    <button class="btn" id="unselectAllBtn" hidden>Unselect All</button>
                    <button class="btn" id="cancelBtn">Cancel</button>
                </div>
            </div>
            <div class="grid" id="grid"></div>
            <div class="select-ops" id="selectOps" hidden>
                <div class="menu-row">
                    <button class="btn menu-btn" id="selectBtnPlus">
                        <span class="menu-input-label">Add</span>
                        <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="1" />
                    </button>
                </div>
                <div class="menu-row">
                    <button class="btn menu-btn" id="selectBtnMinus">
                        <span class="menu-input-label">Minus</span>
                        <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="1" />
                    </button>
                </div>
                <div class="menu-row">
                    <button class="btn menu-btn" id="selectBtnMultiply">
                        <span class="menu-input-label">Multiply</span>
                        <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="2" />
                    </button>
                </div>
                <div class="menu-row">
                    <button class="btn menu-btn" id="selectBtnDivideFloor">
                        <span class="menu-input-label">Divide (floor to)</span>
                        <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="2" />
                    </button>
                </div>
                <div class="menu-row">
                    <button class="btn menu-btn" id="selectBtnDivideCeil">
                        <span class="menu-input-label">Divide (ceil to)</span>
                        <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="2" />
                    </button>
                </div>
                <div class="menu-row">
                    <button class="btn menu-btn" id="selectBtnSet">
                        <span class="menu-input-label">Set to</span>
                        <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="0" />
                    </button>
                </div>
                <div class="menu-row" id="selectBtnDelete">
                    <button class="btn menu-btn btn-danger">Delete</button>
                </div>
            </div>
            <div class="main-actions">
                <button class="btn btn-lg" id="sortBtn">Sort</button>
                <button class="btn btn-lg" id="chooseBtn">Choose</button>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay" hidden>
            <div class="modal" id="modal" role="dialog" aria-modal="true">
                <div class="menu" id="templateAdd" hidden>
                    <div class="section-line menu-title">
                        <span class="section-label">New Candidate</span>
                    </div>
                    <div class="menu-row">
                        <span>Name:</span>
                        <input class="add-input" id="addInput" type="text" autocomplete="off" spellcheck="false" placeholder="Unnamed" />
                        <button class="btn btn-ok" id="addBtnOk">ok</button>
                    </div>
                </div>

                <div class="menu" id="templateSort" hidden>
                    <div class="section-line menu-title">
                        <span class="section-label">Sort</span>
                    </div>
                    <div class="modal-msg">The list is empty.</div>
                    <ol class="sort-list"></ol>
                </div>

                <div class="menu" id="templateChoose" hidden>
                    <div class="section-line menu-title">
                        <span class="section-label">Random Choice</span>
                    </div>
                    <div class="modal-msg">The list is empty.</div>
                    <div class="chosen-name"></div>
                    <div class="menu-row">
                        <button class="btn btn-ok" id="chooseBtnOK">ok</button>
                        <button class="btn" id="chooseBtnAgain">choose again</button>
                        <button class="btn" id="chooseBtnClear">clear the candidate</button>
                        <button class="btn btn-danger" id="chooseBtnDelete">delete the candidate</button>
                    </div>
                </div>

                <div class="menu" id="templateClearAll" hidden>
                    <div class="modal-msg">
                        Clear all candidates?
                    </div>
                    <div class="menu-row">
                        <button class="btn" id="clearBtnCancel">Cancel</button>
                        <button class="btn btn-danger" id="clearBtnYes">Clear All</button>
                    </div>
                </div>

                <div class="menu" id="templateCandidateMenu" hidden>
                    <div class="section-line menu-title">
                        <span class="section-label"></span>
                    </div>
                    <div class="menu-row">
                        <button class="btn menu-btn" id="candidateBtnPlus">
                            <span class="menu-input-label">Add</span>
                            <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="1" />
                        </button>
                    </div>
                    <div class="menu-row">
                        <button class="btn menu-btn" id="candidateBtnMinus">
                            <span class="menu-input-label">Minus</span>
                            <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="1" />
                        </button>
                    </div>
                    <div class="menu-row">
                        <button class="btn menu-btn" id="candidateBtnSet">
                            <span class="menu-input-label">Set to</span>
                            <input class="menu-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" data-default="0" />
                        </button>
                    </div>
                    <div class="menu-row">
                        <button class="btn menu-btn" id="candidateBtnRename">
                            <span class="menu-input-label">Rename to</span>
                            <input class="menu-input menu-input-text" type="text" autocomplete="off" spellcheck="false" placeholder="Unnamed" />
                        </button>
                    </div>
                    <div class="menu-row" id="candidateBtnDelete">
                        <button class="btn menu-btn btn-danger">Delete</button>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- footer -->
    <footer class="site-footer" role="contentinfo">
        <div class="container">
            <span data-key="footer.copyright">©2026 CleverYuangui.<br />All Rights Reserved.</span>
        </div>
    </footer>

    <!-- template -->
    <template id="templateAddBtn">
        <button class="add-btn">
            <span class="add-label">Add</span>
        </button>
    </template>

    <template id="alertText">
        <span id="alertTextP">Invalid input: Please enter an positive integer.</span>
        <span id="alertTextN">Invalid input: Please enter an non-negative integer.</span>
    </template>

    <!-- script -->
    <script src="/js/common.js"></script>
    <script src="/js/tools/poll.js"></script>
</body>
</html>
